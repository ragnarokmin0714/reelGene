name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # Compiler errors and test panics become annotations, which the public
      # API serves; job logs need a login.
      - run: echo "::add-matcher::.github/rust-matcher.json"
      - if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      # On both systems: part of the platform code only compiles on one.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  deny:
    strategy:
      fail-fast: false
      matrix:
        # One run per release target; see deny.toml for why not all at once.
        target: [x86_64-pc-windows-msvc, x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --target ${{ matrix.target }}
          command: check
