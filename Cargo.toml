[workspace]
resolver = "3"
members = ["crates/reelgene-core", "crates/reelgene-app", "crates/reelgene-gui", "crates/reelgene"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ragnarokmin0714/reelgene"
publish = false

[workspace.dependencies]
reelgene-core = { path = "crates/reelgene-core" }
reelgene-app = { path = "crates/reelgene-app" }
reelgene-gui = { path = "crates/reelgene-gui" }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "fs", "sync", "time", "process", "io-util"] }
tokio-util = "0.7.20"
futures = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "gzip", "http2", "system-proxy"] }
url = { version = "2.5.8", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
async-trait = "0.1.92"
# std: set_boxed_logger. The window used to switch it on by accident.
log = { version = "0.4.34", features = ["std"] }
aes = "0.9.3"
cbc = "0.2.1"
hex = "0.4.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
clap = { version = "4.6.7", features = ["derive"] }
# The window. glow (OpenGL) rather than wgpu: smaller, and runs in VMs and on
# old GPUs. Minor version pinned: egui breaks its API between minors.
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "system_fonts", "wayland", "x11", "clipboard", "accesskit", "persistence"] }
egui_kittest = "0.37.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
