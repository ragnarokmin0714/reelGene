# The program itself is the root package (src/); the three libraries it is
# built from sit under crates/.
[package]
name = "reelgene"
description = "Portable video downloader for Windows and Linux: HLS playlists and direct links, resumable."
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ragnarokmin0714/reelgene"
publish = false

[features]
default = ["gui"]
# Without it: the command line only, no window toolkit linked (servers).
gui = ["dep:reelgene-gui"]

[dependencies]
reelgene-core.workspace = true
reelgene-app.workspace = true
reelgene-gui = { workspace = true, optional = true }
tokio = { workspace = true, features = ["signal"] }
clap.workspace = true
url.workspace = true
serde_json.workspace = true
log.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"

[workspace]
resolver = "3"
members = ["crates/core", "crates/app", "crates/gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ragnarokmin0714/reelgene"
publish = false

[workspace.dependencies]
reelgene-core = { path = "crates/core" }
reelgene-app = { path = "crates/app" }
reelgene-gui = { path = "crates/gui" }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "fs", "sync", "time", "process", "io-util"] }
tokio-util = "0.7.20"
futures = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "gzip", "http2", "system-proxy", "socks"] }
url = { version = "2.5.8", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
async-trait = "0.1.92"
# std: set_boxed_logger. The window used to switch it on by accident.
log = { version = "0.4.34", features = ["std"] }
aes = "0.9.3"
cbc = "0.2.1"
hex = "0.4.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
clap = { version = "4.6.7", features = ["derive"] }
# The window. glow (OpenGL) rather than wgpu: smaller, and runs in VMs and on
# old GPUs. Minor version pinned: egui breaks its API between minors.
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "system_fonts", "wayland", "x11", "clipboard", "accesskit", "persistence"] }
egui_kittest = "0.37.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
