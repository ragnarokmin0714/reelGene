[package]
name = "reelgene"
description = "Portable video downloader for Windows and Linux: HLS playlists and direct links, resumable."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
reelgene-core.workspace = true
tokio = { workspace = true, features = ["signal"] }
clap.workspace = true
url.workspace = true
serde.workspace = true
serde_json.workspace = true
eframe.workspace = true
# Text only: the image feature would pull in a whole image codec stack.
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
# Local time for quiet hours; std has none.
jiff = "0.2.38"

[target.'cfg(target_os = "linux")'.dependencies]
# Tray over D-Bus (StatusNotifierItem): pure Rust, no GTK.
ksni = "0.3.6"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.26.1"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Media_Audio",
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
egui_kittest.workspace = true
async-trait.workspace = true

[lints.rust]
# Platform glue (console, sound) will need a little FFI; each use gets a local
# allow and a SAFETY comment instead of opening the whole crate.
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
