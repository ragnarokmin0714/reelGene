[package]
name = "reelgene"
description = "Portable video downloader for Windows and Linux: HLS playlists and direct links, resumable."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["gui"]
# Without it: the command line only, no window toolkit linked (servers).
gui = ["dep:reelgene-gui"]

[dependencies]
reelgene-core.workspace = true
reelgene-app.workspace = true
reelgene-gui = { workspace = true, optional = true }
tokio = { workspace = true, features = ["signal"] }
clap.workspace = true
url.workspace = true
serde_json.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
